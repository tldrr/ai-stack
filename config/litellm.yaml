model_list:
  # Responses-only Copilot models. LiteLLM bridges Chat Completions callers.
  - model_name: gpt-5.3-codex
    model_info:
      mode: responses
    litellm_params:
      model: github_copilot/gpt-5.3-codex
  - model_name: gpt-5.4-mini
    model_info:
      mode: responses
    litellm_params:
      model: github_copilot/gpt-5.4-mini
